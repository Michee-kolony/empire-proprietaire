<ion-header class="gd-header" [translucent]="false">
  <ion-toolbar class="gd-toolbar">
    <div class="gd-toolbar-inner">
      <div class="gd-brand">
        <a class="gd-back-btn" *ngIf="retour" [routerLink]="retour" routerDirection="back" aria-label="Retour">
          <ion-icon name="arrow-back"></ion-icon>
        </a>
        <img class="gd-header-avatar" *ngIf="avatar !== undefined" [class.carre]="avatarRepli === 'propriete'"
          [gdImage]="avatar" [gdRepli]="avatarRepli" alt="">
        <div class="gd-brand-badge" *ngIf="!retour">
          <img src="assets/gardien/mark.png" alt="Empire Security">
        </div>
        <div class="gd-brand-text">
          <span class="gd-title">{{ title }}</span>
          <span class="gd-subtitle" *ngIf="subtitle">{{ subtitle }}</span>
        </div>
      </div>
      <button type="button" class="gd-menu-btn" (click)="ouvrirMenu()" aria-label="Ouvrir le menu">
        <ion-icon name="menu"></ion-icon>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="gd-content">
  <ng-content></ng-content>
  <div class="gd-bottom-spacer" *ngIf="!sansNav"></div>
</ion-content>

<!-- Écran sans barre du bas (ex : discussion) : pied fourni par la page -->
<ng-content select="[shellPied]"></ng-content>

<nav class="gd-bottom-nav" *ngIf="!sansNav">
  <a
    *ngFor="let item of navItems"
    [routerLink]="item.path"
    routerLinkActive="active"
    class="gd-nav-item"
  >
    <span class="gd-nav-icon">
      <ion-icon [name]="item.icon"></ion-icon>
      <span class="gd-nav-badge" *ngIf="item.badge && (item.badge | async) as n">{{ n > 99 ? '99+' : n }}</span>
    </span>
    <span class="gd-nav-label">{{ item.label }}</span>
  </a>
</nav>
