<ion-content class="gd-mn-content">
  <div class="gd-mn">

    <!-- En-tête : marque + gardien connecté -->
    <div class="gd-mn-tete">
      <div class="gd-mn-marque">
        <div class="gd-brand-badge"><img src="assets/gardien/mark.png" alt=""></div>
        <span>Empire Security</span>
      </div>

      <ion-menu-toggle [autoHide]="false" *ngIf="gardien$ | async as g">
        <a class="gd-mn-profil" routerLink="/gardien/profil">
          <img [gdImage]="g.photoProfil" gdRepli="avatar" alt="Photo du gardien" class="gd-avatar">
          <div class="gd-mn-identite">
            <strong>{{ nomComplet(g) }}</strong>
            <span>Matricule {{ g.matricule }}</span>
            <span class="gd-status-pill" [class.active]="g.statut === 'en service'">
              <ion-icon name="ellipse"></ion-icon>
              {{ g.statut === 'en service' ? 'En service' : 'Non en service' }}
            </span>
          </div>
        </a>
      </ion-menu-toggle>
    </div>

    <!-- Navigation -->
    <nav class="gd-mn-nav">
      <section *ngFor="let s of sections">
        <h4>{{ s.titre }}</h4>
        <ion-menu-toggle [autoHide]="false" *ngFor="let e of s.entrees">
          <a class="gd-mn-lien" [routerLink]="e.path" routerLinkActive="active" routerDirection="root">
            <span class="gd-mn-icone"><ion-icon [name]="e.icon"></ion-icon></span>
            <span>{{ e.label }}</span>
            <ion-icon name="chevron-forward" class="gd-mn-fleche"></ion-icon>
          </a>
        </ion-menu-toggle>
      </section>
    </nav>

    <!-- Pied : déconnexion -->
    <div class="gd-mn-pied">
      <button type="button" class="gd-mn-deconnexion" (click)="deconnexion()">
        <ion-icon name="log-out-outline"></ion-icon>
        Se déconnecter
      </button>
      <p>Empire Security · Espace gardien</p>
    </div>

  </div>
</ion-content>
