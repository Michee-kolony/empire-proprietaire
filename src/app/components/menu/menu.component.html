<ion-content class="gd-mn-content">
  <div class="gd-mn">

    <!-- En-tête : marque + compte connecté -->
    <div class="gd-mn-tete">
      <div class="gd-mn-marque">
        <div class="gd-brand-badge"><img src="assets/marque/mark.png" alt=""></div>
        <span>Empire Security</span>
      </div>

      <ion-menu-toggle [autoHide]="false" *ngIf="utilisateur$ | async as p">
        <a class="gd-mn-profil" [routerLink]="(espace$ | async) === 'locataire' ? '/locataire/profil' : '/proprietaire/profil'">
          <img [gdImage]="p.photo" gdRepli="avatar" alt="Votre photo" class="gd-avatar">
          <div class="gd-mn-identite">
            <strong>{{ nomComplet(p) }}</strong>
            <span>{{ contact(p) }}</span>
            <span class="gd-status-pill active">
              <ion-icon name="ellipse"></ion-icon>
              {{ role($any(p.role)) }}
            </span>
          </div>
        </a>
      </ion-menu-toggle>
    </div>

    <!-- Navigation -->
    <nav class="gd-mn-nav">
      <section *ngFor="let s of sections$ | async">
        <h4>{{ s.titre }}</h4>
        <ion-menu-toggle [autoHide]="false" *ngFor="let e of s.entrees">
          <a class="gd-mn-lien" [routerLink]="e.path" routerLinkActive="active" routerDirection="root">
            <span class="gd-mn-icone"><ion-icon [name]="e.icon"></ion-icon></span>
            <span>{{ e.label }}</span>
            <span class="gd-mn-badge" *ngIf="e.badge && (nonLus$ | async) as n">{{ n > 99 ? '99+' : n }}</span>
            <ion-icon name="chevron-forward" class="gd-mn-fleche"></ion-icon>
          </a>
        </ion-menu-toggle>
      </section>
    </nav>

    <!-- Pied : déconnexion -->
    <div class="gd-mn-pied">
      <button type="button" class="gd-mn-deconnexion" (click)="deconnexion()">
        <ion-icon name="log-out-outline"></ion-icon>
        Se déconnecter
      </button>
      <p>Empire Security · Espace {{ (espace$ | async) === 'locataire' ? 'locataire' : 'propriétaire' }}</p>
    </div>

  </div>
</ion-content>
